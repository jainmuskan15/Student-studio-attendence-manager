{% extends 'base.html' %}{% block title %}Edit student{% endblock %}{% block crumb %}Students / Edit{% endblock %}{% block content %}
<a class="back" href="{{ url_for('students') }}">← Back to students</a><div class="page-intro"><div><div class="eyebrow"><span class="eyebrow-line"></span> STUDENT PROFILE</div><h1>Edit student<span class="title-dot">.</span></h1><p>Update the student's information below.</p></div></div><section class="panel edit-panel"><div class="eyebrow small">PERSONAL DETAILS · #{{ student.id }}</div><form class="field-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Student full name <span>*</span><input name="name" required maxlength="120" value="{{ request.form.get('name',student.name) }}"></label><div class="form-two"><label>Student phone <span>*</span><input name="phone" required maxlength="24" value="{{ request.form.get('phone',student.phone or '') }}" type="tel"></label><label>Parent phone <span>*</span><input name="parent_phone" required maxlength="24" value="{{ request.form.get('parent_phone',student.parent_phone or '') }}" type="tel"></label></div><label>Secondary grade <span>*</span><select name="grade_level" required><option value="" disabled>Select grade</option>{% for value,label in grades %}<option value="{{ value }}" {% if request.form.get('grade_level',student.grade_level) == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><div class="modal-actions"><a href="{{ url_for('students') }}" class="btn secondary">Cancel</a><button class="btn primary" type="submit">Save changes ↗</button></div></form></section>
{% endblock %}
